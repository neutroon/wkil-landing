name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","hostinger"]') }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install (reproducible)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
        env:
          # The snapshot-drift test compares src/data/plans.snapshot.json with the live catalog.
          WKIL_PLANS_URL: https://api.wkil.app/v1/public/plans
      - name: Build
        run: npm run build
